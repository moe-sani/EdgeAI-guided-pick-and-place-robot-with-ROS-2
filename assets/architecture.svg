<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340" role="img" aria-labelledby="title desc">
<title id="title">Local AI robot command architecture</title>
<desc id="desc">With safety enabled, a command passes through a camera check, language planning, plan validation, robot skills and motion control. The same local Qwen3-VL model serves both AI calls. Gazebo supplies camera frames and object pose feedback. A risky check refuses the command before planning. The check runs once at command start.</desc>
