<text x="60" y="134.6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#526678" text-anchor="start">Dragonwing IQ9  /  ROS 2 Jazzy  /  Gazebo Harmonic</text>
