controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05

gripper_controller:
  ros__parameters:
    joints: [gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 1.0
      # A closed gripper stalls on the cube before reaching its target; that's a successful grasp.
      gripper: {goal: 0.0, trajectory: 0.0}
