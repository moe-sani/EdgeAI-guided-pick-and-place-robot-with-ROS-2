<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Robot Arm · LLM Commander</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#14171c; --panel:#1d222a; --line:#2b313b; --text:#e6e9ee; --dim:#8b95a5;
          --blue:#4c8dff; --green:#2fbf71; --red:#ff4d5e; --amber:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text);
         height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .pill { padding:2px 10px; border-radius:999px; font-size:12px; background:var(--line); color:var(--dim); }
  .pill.busy { background:#3a2f12; color:var(--amber); }
  .pill.off { background:#3b1820; color:var(--red); }
  .grow { flex:1; }
  main { flex:1; display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); min-height:0; }
  #chat { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; }
  #log { flex:1; overflow-y:auto; padding:12px 16px; font-family:ui-monospace, monospace; font-size:13px; }
  .l { padding:3px 8px; margin:2px 0; border-left:3px solid transparent; white-space:pre-wrap; word-break:break-word; }
  .l.user { margin-top:12px; border-color:var(--blue); background:#1a2433; color:#fff; font-family:system-ui; font-size:14px; }
  .l.llm { border-color:#8a7dff; color:#cfc9ff; }
  .l.risk { border-color:var(--red); background:#3b1820; color:#ffd0d5; font-weight:600; }
  .l.clear { border-color:var(--green); color:#a8ecc6; }
  .l.warn { border-color:var(--amber); color:#ffe2a0; }
  .l.error { border-color:var(--red); color:#ff9aa5; }
  .l.done { border-color:var(--green); color:var(--green); }
  .l.scene { border-color:#5b6576; color:var(--dim); }
  .l.info { color:var(--dim); }
  #examples { padding:6px 16px 0; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { cursor:pointer; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--dim); font-size:12px; background:none; }
  .chip:hover { color:var(--text); border-color:var(--blue); }
  form { display:flex; gap:8px; padding:10px 16px 14px; }
  input[type=text] { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14px; }
  button { cursor:pointer; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:13px; }
  button:hover { border-color:var(--blue); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #mic { min-width:48px; font-size:16px; }
  #mic.rec { background:var(--red); border-color:var(--red); color:#fff; animation:pulse 1s infinite; }
  #mic.busy { color:var(--amber); }
  @keyframes pulse { 50% { opacity:.6; } }
  #speakpill { cursor:pointer; }
  #speakpill.on { background:#1a2433; color:var(--blue); }
  button.danger { border-color:#6b2730; }
  button.danger:hover { border-color:var(--red); }
  #side { padding:14px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card h2 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:600; }
  #cam { width:100%; aspect-ratio:4/3; display:block; border-radius:6px; background:#000; object-fit:contain; }
  #camnote { color:var(--dim); font-size:12px; margin-top:4px; }
  #verdict { display:flex; align-items:center; gap:12px; }
  #badge { font-size:18px; font-weight:700; padding:8px 14px; border-radius:8px; background:var(--line); color:var(--dim); min-width:110px; text-align:center; }
  #badge.clear { background:#123d27; color:var(--green); }
  #badge.risk { background:#4a1520; color:var(--red); }
  #judged { width:140px; border-radius:6px; display:none; }
  #vtext { color:var(--dim); font-size:12px; flex:1; }
  #verdict.inactive #badge { background:var(--line); color:var(--dim); }
  #verdict.inactive #judged { filter:grayscale(1); opacity:.5; }
  .buttons { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  #safetypill { cursor:pointer; }
  #safetypill.on { background:#123d27; color:var(--green); }
  #safetybtn { width:100%; margin-bottom:10px; padding:11px; font-size:15px; font-weight:600; }
  #safetybtn.on { background:#123d27; border-color:var(--green); color:var(--green); }
  #safetybtn.off { color:var(--dim); }
  #safetybtn:disabled { opacity:.5; cursor:not-allowed; }
  #promptbox { margin-top:12px; }
  #promptbox label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  #prompt { width:100%; min-height:58px; resize:vertical; padding:8px 10px; border-radius:8px;
            border:1px solid var(--line); background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
  #prompt:disabled { opacity:.6; cursor:not-allowed; }
  #prompt.dirty { border-color:var(--amber); }
  .promptrow { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .promptrow button { padding:6px 12px; }
  #prompthint { font-size:12px; color:var(--dim); flex:1; }
</style>
</head>
<body>
<header>
  <h1>Robot Arm · LLM Commander</h1>
  <span id="status" class="pill">connecting…</span>
  <span id="model" class="pill"></span>
  <span class="grow"></span>
  <span id="speakpill" class="pill" title="Read the robot's replies aloud (offline voice)">🔇 voice off</span>
  <span id="safetypill" class="pill" title="Click to switch the safety check on/off">safety …</span>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div id="examples"></div>
    <form id="form">
      <input type="text" id="cmd" placeholder="Tell the robot what to do…" autocomplete="off" autofocus>
      <button type="button" id="mic" title="Click, speak your command, click again: the text appears in the box to check and send" style="display:none">🎤</button>
      <button class="primary" type="submit">Send</button>
    </form>
  </section>
  <aside id="side">
    <div class="card">
      <h2>Safety camera (live)</h2>
      <img id="cam" alt="safety camera">
      <div id="camnote"></div>
    </div>
    <div class="card">
      <h2>Safety check</h2>
      <button id="safetybtn" type="button" class="off"
              title="When ON, every command starts with a camera check by the VLM">Safety check: …</button>
      <div id="verdict">
        <div id="badge">—</div>
        <div id="vtext">No check yet.</div>
        <img id="judged" alt="frame the VLM judged" title="Frame the VLM judged">
      </div>
      <div id="promptbox">
        <label for="prompt">Question asked about each camera frame (the answer must be yes = risky, or no)</label>
        <textarea id="prompt" rows="2" spellcheck="false"></textarea>
        <div class="promptrow">
          <span id="prompthint"></span>
          <button type="button" id="promptdefault" title="Go back to the built-in question">Default</button>
          <button type="button" id="promptsave" class="primary">Save</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Scene</h2>
      <div class="buttons">
        <button data-action="reset" title="Gripper open, robot home, cubes back to start">↺ Reset scene</button>
        <button data-action="home">⌂ Robot home</button>
        <button data-action="check">👁 Check now</button>
        <button data-action="spawn_person" class="danger" title="Sits Bob (a test person) on the table in the robot's path (re-click to put him back)">🧍 Spawn Bob</button>
        <button data-action="remove_person">✕ Remove Bob</button>
      </div>
    </div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let seq = 0, lastVerdictAt = null, boot = null, safetyOn = false, promptDirty = false, serverPrompt = null;
const EXAMPLES = [
  'Pick up the red cube and place it in the blue tray.',
  'Put the green cube in the green tray',
  'Pick up the blue cube', 'Put it in the box', 'Put all cubes in the box', 'Go home',
];

function addLine(kind, text) {
  const log = $('log');
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  const d = document.createElement('div');
  d.className = 'l ' + kind;
  d.textContent = kind === 'user' ? text.replace(/^\[command\]\s*/, '') : text;
  log.appendChild(d);
  if (stick) log.scrollTop = log.scrollHeight;
}

async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) addLine('error', '[ui] ' + (await r.text()));
}

function ago(s) {
  return s < 60 ? `${s}s ago` : `${Math.round(s / 60)} min ago`;
}

async function poll() {
  try {
    let s = await (await fetch('/api/state?since=' + seq)).json();
    if (s.boot !== boot) {  // commander (re)started: reload the whole log
      if (boot !== null) $('log').replaceChildren();
      boot = s.boot;
      seq = 0;
      s = await (await fetch('/api/state?since=0')).json();
      spokenUpTo = s.seq;
    }
    for (const [lseq, kind, text] of s.lines) { addLine(kind, text); if (lseq > spokenUpTo) speakLine(kind, text); }
    spokenUpTo = Math.max(spokenUpTo, s.seq);
    $('mic').style.display = s.voice ? '' : 'none';
    ttsServer = !!s.tts;
    seq = s.seq;
    const st = $('status');
    st.textContent = s.busy ? `robot busy${s.queued ? ` · ${s.queued} queued` : ''}` : 'ready';
    st.className = 'pill' + (s.busy ? ' busy' : '');
    $('model').textContent = s.model + (s.dry_run ? ' · dry run' : '');
    safetyOn = s.safety;
    $('safetybtn').textContent = !s.camera ? 'Safety check unavailable (no camera)'
      : s.safety ? '🛡 Safety check: ON  (click to turn off)' : 'Safety check: OFF  (click to turn on)';
    $('safetybtn').className = s.safety ? 'on' : 'off';
    $('safetybtn').disabled = !s.camera;
    $('safetypill').textContent = s.safety ? 'safety ON' : 'safety OFF';
    $('safetypill').className = 'pill' + (s.safety ? ' on' : '');
    updatePrompt(s);
    const v = s.verdict;
    // With the safety check off, the last result doesn't gate anything: show it greyed out.
    $('verdict').classList.toggle('inactive', !s.safety);
    if (!v) $('vtext').textContent = s.safety ? 'No check yet.' : 'Safety check is off.';
    if (v) {
      $('badge').textContent = v.risky ? 'RISK' : 'CLEAR';
      $('badge').className = v.risky ? 'risk' : 'clear';
      $('vtext').textContent = (s.safety ? '' : 'Safety check is off. Last result: ')
        + `${v.reason} · ${v.seconds}s · ${ago(v.age)}`;
      if (v.at !== lastVerdictAt) {
        lastVerdictAt = v.at;
        $('judged').src = '/api/judged.jpg?t=' + v.at;
        $('judged').style.display = 'block';
      }
    }
  } catch (e) {
    $('status').textContent = 'disconnected';
    $('status').className = 'pill off';
  }
  setTimeout(poll, 700);
}

function nextFrame() { $('cam').src = '/api/camera.jpg?t=' + Date.now(); }
$('cam').onload = () => { $('camnote').textContent = ''; setTimeout(nextFrame, 300); };
$('cam').onerror = () => {
  $('camnote').textContent = 'No camera image. Is the sim running? Use "Reset scene" to (re)spawn the camera.';
  setTimeout(nextFrame, 2000);
};

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('cmd').value.trim();
  if (text) { post('/api/command', {text}); $('cmd').value = ''; }
};
function toggleSafety() {
  if (!safetyOn && promptDirty && !confirm('The edited safety question is not saved. Turn the safety check on anyway (with the saved question)?')) return;
  post('/api/action', {name: safetyOn ? 'safety_off' : 'safety_on'});
}

function updatePrompt(s) {
  const box = $('prompt');
  if (!('safety_prompt' in s)) {  // page is newer than the running commander
    box.value = ''; box.disabled = true;
    $('promptsave').disabled = $('promptdefault').disabled = true;
    $('prompthint').textContent = '⚠ Restart the commander to edit the safety question here.';
    return;
  }
  const locked = !s.camera || s.safety;
  box.placeholder = s.default_safety_prompt || '';
  if (s.safety_prompt !== serverPrompt) {  // changed on the server (saved here, another tab, or restart)
    serverPrompt = s.safety_prompt;
    promptDirty = false;
  }
  if (!promptDirty && document.activeElement !== box) box.value = serverPrompt || '';
  if (locked && promptDirty) { box.value = serverPrompt || ''; promptDirty = false; }  // safety turned on elsewhere
  box.disabled = locked;
  box.classList.toggle('dirty', promptDirty);
  $('promptsave').disabled = locked || !promptDirty;
  $('promptdefault').disabled = locked || (serverPrompt === s.default_safety_prompt && !promptDirty);
  $('prompthint').textContent = !s.camera ? 'No camera connected.'
    : s.safety ? '🔒 Turn the safety check off to edit.'
    : promptDirty ? 'Not saved yet.'
    : serverPrompt === s.default_safety_prompt ? 'Using the default question.' : 'Using a custom question.';
}

async function savePrompt(text) {
  const r = await fetch('/api/safety_prompt', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                body: JSON.stringify({text})});
  if (!r.ok) { addLine('error', '[ui] ' + ((await r.json()).error || r.statusText)); return; }
  serverPrompt = (await r.json()).prompt;
  $('prompt').value = serverPrompt;
  promptDirty = false;
  $('prompt').blur();
}

$('prompt').oninput = () => { promptDirty = $('prompt').value.trim() !== (serverPrompt || ''); };
$('prompt').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (promptDirty) savePrompt($('prompt').value); } };
$('promptsave').onclick = () => savePrompt($('prompt').value);
$('promptdefault').onclick = () => savePrompt('');
$('safetybtn').onclick = toggleSafety;
$('safetypill').onclick = toggleSafety;
document.querySelectorAll('[data-action]').forEach(b => b.onclick = () => post('/api/action', {name: b.dataset.action}));
for (const ex of EXAMPLES) {
  const c = document.createElement('button');
  c.className = 'chip'; c.textContent = ex; c.type = 'button';
  c.onclick = () => { $('cmd').value = ex; $('cmd').focus(); };
  $('examples').appendChild(c);
}
// ---------- voice: read replies aloud (browser's offline voices) ----------
let spokenUpTo = 0;  // log lines up to here are not read out (set on (re)connect: no reading old history)
let speakOn = localStorage.getItem('speak') === '1';
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.localService && v.lang.startsWith('en'));
  for (const name of ['Samantha', 'Daniel', 'Karen', 'Moira', 'Alex', 'Google UK English Female']) {
    const v = vs.find(v => v.name.startsWith(name)); if (v) return v;
  }
  return vs[0] || null;
}
let ttsServer = false, speechChain = Promise.resolve(), speechGen = 0;
function say(text) {
  if (!speakOn || !text) return;
  if (ttsServer) {  // natural offline voice (Piper) generated on the robot PC; played one after another
    const gen = speechGen;
    const audio = fetch('/api/tts?text=' + encodeURIComponent(text)).then(r => r.ok ? r.blob() : null);
    speechChain = speechChain.then(() => audio).then(blob => new Promise(done => {
      if (!blob || gen !== speechGen || !speakOn) return done();
      const a = new Audio(URL.createObjectURL(blob));
      a.onended = a.onerror = () => { URL.revokeObjectURL(a.src); done(); };
      a.play().catch(done);
      currentAudio = a;
    })).catch(() => {});
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;  // browser fallback: only local (offline) voices are used
  speechSynthesis.speak(u);
}
let currentAudio = null;
function stopSpeaking() {
  speechGen++;  // drop anything still queued
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  speechSynthesis.cancel();
}
function speakLine(kind, text) {
  if (kind === 'llm' && text.startsWith('[llm ')) say(text.replace(/^\[llm [^\]]*\]\s*/, ''));
  else if (kind === 'risk') say('Safety risk detected.');
  else if (text.startsWith('[safety] Command refused')) say('Command refused. The robot will not move.');
  else if (kind === 'done' && text.startsWith('[done] All steps')) say('Done.');
  else if (text.startsWith('[failed]')) say('Failed. ' + text.replace(/^\[failed\]\s*/, '').replace(/\([^)]*\)/g, '').replace('Stopping the remaining steps.', ''));
  else if (text.startsWith('[error]')) say('Error.');
  else if (text.startsWith('[voice] (nothing heard')) say('Sorry, I did not hear anything.');
}
function showSpeak() {
  $('speakpill').textContent = speakOn ? '🔊 voice on' : '🔇 voice off';
  $('speakpill').className = 'pill' + (speakOn ? ' on' : '');
}
$('speakpill').onclick = () => {
  speakOn = !speakOn; localStorage.setItem('speak', speakOn ? '1' : '0'); showSpeak();
  if (speakOn) say('Voice replies on.'); else stopSpeaking();
};
showSpeak();
speechSynthesis.getVoices();

// ---------- voice: microphone -> 16 kHz WAV -> robot PC (whisper.cpp) ----------
let rec = null;
async function startRec() {
  if (!navigator.mediaDevices) {
    addLine('error', '[voice] The browser only allows the microphone on https:// or http://localhost pages. '
      + 'Start the commander with --https, or forward port ' + location.port + ' and open http://localhost:' + location.port);
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true}});
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = [];
  proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(ctx.destination);
  rec = {stream, ctx, src, proc, chunks, rate: ctx.sampleRate};
  stopSpeaking();
  $('mic').className = 'rec'; $('mic').textContent = '■';
}
function toWav16k(chunks, rate) {
  const n = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(n);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const ratio = rate / 16000, len = Math.floor(n / ratio), pcm = new Int16Array(len);
  for (let i = 0; i < len; i++) {  // average the samples that fall into each 16 kHz slot
    const a = Math.floor(i * ratio), b = Math.min(n, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += all[j];
    const v = sum / Math.max(1, b - a); pcm[i] = Math.max(-1, Math.min(1, v)) * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), d = new DataView(buf);
  const w = (p, str) => { for (let i = 0; i < str.length; i++) d.setUint8(p + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); d.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, 16000, true);
  d.setUint32(28, 32000, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, 'data');
  d.setUint32(40, pcm.length * 2, true); new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], {type: 'audio/wav'});
}
async function stopRec() {
  const r = rec; rec = null;
  r.proc.disconnect(); r.src.disconnect(); r.stream.getTracks().forEach(t => t.stop()); await r.ctx.close();
  $('mic').className = 'busy'; $('mic').textContent = '…'; $('mic').disabled = true;
  try {
    const resp = await fetch('/api/voice', {method: 'POST', headers: {'Content-Type': 'audio/wav'}, body: toWav16k(r.chunks, r.rate)});
    const res = await resp.json();
    if (!resp.ok) addLine('error', '[voice] ' + (res.error || resp.statusText));
    else if (res.text) {  // put it in the box for the user to check, edit and send (Enter)
      $('cmd').value = res.text;
      $('cmd').focus();
      $('cmd').setSelectionRange(res.text.length, res.text.length);
    }
  } finally {
    $('mic').className = ''; $('mic').textContent = '🎤'; $('mic').disabled = false;
  }
}
$('mic').onclick = () => (rec ? stopRec() : startRec()).catch(e => {
  addLine('error', '[voice] ' + e.message); rec = null; $('mic').className = ''; $('mic').textContent = '🎤';
});

nextFrame();
poll();
</script>
</body>
</html>
